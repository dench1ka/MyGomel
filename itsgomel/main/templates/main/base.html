<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> {% block title %}Creative Agency{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
  {% block styles %}

  {% endblock %}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Creative Agency</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#portfolio">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link" href="#about">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

  {% block content %}
  {% endblock %}

  <footer class="footer-custom">
  <div class="container">
    <div class="row justify-content-between align-items-center">
      <div class="col-md-6 text-md-start text-center mb-3 mb-md-0 animate__animated animate__fadeIn">
        <p class="mb-0">&copy; 2023 Creative Agency. All rights reserved.</p>
      </div>

      <div class="col-md-6 text-md-end text-center animate__animated animate__fadeIn">
        <a href="#" class="footer-brand-icon"><i class="fab fa-twitter"></i></a>
        <a href="#" class="footer-brand-icon"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" class="footer-brand-icon"><i class="fab fa-google-plus-g"></i></a>
        <a href="#" class="footer-brand-icon"><i class="fab fa-facebook-f"></i></a>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}
  {% endblock %}
</body>
</html>
