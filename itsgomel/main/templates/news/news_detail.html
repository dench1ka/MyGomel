{% extends 'general/news_base.html' %}
{% load static %}

{% block title %}{{ news.title }}{% endblock %}

{% block news_content %}
<section class="news-detail">
    <a href="{% url 'news_list' %}" class="back-to-news">&larr; Все новости</a>
    <h1>{{ news.title }}</h1>

    <div class="news-images">
        {% for img in news.images.all %}
            <img src="{{ img.image.url }}" alt="{{ news.title }}">
        {% endfor %}
        <button class="slider-prev">←</button>
        <button class="slider-next">→</button>
    </div>

    <div class="news-description">
        <p>{{ news.description|linebreaks }}</p>
    </div>
    <span class="news-date">{{ news.date|date:"d.m.Y H:i" }}</span>
</section>

<script src="{% static 'news/js/news.js' %}"></script>
{% endblock %}
